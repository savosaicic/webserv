server {
	cgi .b /bin/bash
	cgi . /bin/perl
	listen 0.0.0.0:9090
	server_name localhost:9090

	error_page 403 /mnt/nfs/homes/sasaicic/webserv/www/403.html
	error_page 500 /mnt/nfs/homes/sasaicic/webserv/www/500.html
	error_page 404 /mnt/nfs/homes/sasaicic/webserv/www/404.html

	client_max_body_size 10

	location / {
	  root /mnt/nfs/homes/sasaicic/webserv/www
		autoindex on
		index index.html
	}
}
