server {
	cgi .bash /bin/bash
	cgi .cgi /bin/perl
	listen 0.0.0.0:9090
	server_name localhost:9090

	error_page 403 /mnt/nfs/homes/sasaicic/webserv/www/403.html
	error_page 500 /mnt/nfs/homes/sasaicic/webserv/www/500.html
	error_page 404 /mnt/nfs/homes/sasaicic/webserv/www/404.html
	error_page 413 /mnt/nfs/homes/sasaicic/webserv/www/foo.png

	client_max_body_size 150M

	location / {
	  root /mnt/nfs/homes/sasaicic/webserv/www
		autoindex off
		index index.html
	}
	location /autoindex {
	  root /mnt/nfs/homes/sasaicic/webserv/www/autoindex
		autoindex on
	}
	location /redirection {
    return 302 http://google.fr
	}
}

server {
	listen 0.0.0.0:9090
	server_name webserv:9090

	client_max_body_size 10B

	location / {
	  root /mnt/nfs/homes/sasaicic/webserv/www2
		autoindex off
		index index.html
    forbid_method POST DELETE
	}
	location /redirection {
    return 302 http://42.fr
	}
}
